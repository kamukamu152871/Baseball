<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPBペナントシミュレーター 完全版</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    .container { max-width: 1400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1, h2, h3 { color: #333; }
    button { padding: 10px 20px; margin: 5px; font-size: 14px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #545b62; }
    button.export { background: #28a745; }
    button.export:hover { background: #218838; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px 4px; text-align: left; }
    th { background: #f8f9fa; font-weight: bold; }
    tr:nth-child(even) { background: #f9f9f9; }
    .section { margin: 30px 0; padding: 20px; border: 1px solid #ddd; border-radius: 4px; }
    .tab-buttons { margin: 20px 0; }
    .tab-buttons button { margin-right: 5px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .standings { font-size: 14px; }
    .standings li { margin: 8px 0; }
    .title-badge { display: inline-block; background: gold; color: #000; padding: 2px 6px; border-radius: 3px; font-weight: bold; font-size: 11px; margin-left: 5px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
    .stat-card { border: 1px solid #ddd; padding: 15px; border-radius: 4px; background: #fafafa; }
    .stat-card h4 { margin: 0 0 10px 0; color: #333; }
    .stat-card p { margin: 3px 0; }
    @media (max-width: 768px) {
      .container { padding: 10px; }
      table { font-size: 11px; }
      th, td { padding: 3px 2px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏟️ NPBペナントシミュレーター【完全版】</h1>
    
    <div class="tab-buttons">
      <button onclick="switchTab('main')">📊 メイン画面</button>
      <button onclick="switchTab('standings')">🏆 順位表</button>
      <button onclick="switchTab('titles')">🥇 タイトル</button>
      <button onclick="switchTab('stats')">📈 個人成績</button>
    </div>

    <!-- メイン画面 -->
    <div id="main" class="tab-content active">
      <h2>ペナントレース</h2>
      <p>進行月: <strong id="currentMonth">3月</strong></p>
      <div style="margin: 20px 0;">
        <button onclick="playMonth()">▶ 1ヶ月進める</button>
        <button onclick="playAll()">⏭ シーズン全体進める</button>
        <button onclick="resetSeason()">🔄 シーズンリセット</button>
        <button class="secondary" onclick="saveSeason()">💾 セーブ</button>
        <button class="secondary" onclick="loadSeason()">📂 ロード</button>
        <button class="export" onclick="exportStats()">📥 成績データ出力</button>
      </div>
      <div id="monthResults"></div>
    </div>

    <!-- 順位表 -->
    <div id="standings" class="tab-content">
      <h2>リーグ順位表</h2>
      <button onclick="showStandings()">🔄 更新</button>
      <div id="standingsContent" style="margin-top: 20px;"></div>
    </div>

    <!-- タイトル -->
    <div id="titles" class="tab-content">
      <h2>シーズンタイトル</h2>
      <button onclick="showTitles()">🔄 更新</button>
      <div id="titlesContent" style="margin-top: 20px;"></div>
    </div>

    <!-- 個人成績 -->
    <div id="stats" class="tab-content">
      <h2>個人成績</h2>
      <div style="margin: 20px 0;">
        <label>リーグ選択: 
          <select id="leagueSelect" onchange="showPlayerStats()">
            <option value="">全て</option>
            <option value="パシフィック">パシフィック</option>
            <option value="セントラル">セントラル</option>
          </select>
        </label>
        <label style="margin-left: 20px;">カテゴリ:
          <select id="categorySelect" onchange="showPlayerStats()">
            <option value="batter">野手</option>
            <option value="pitcher">投手</option>
          </select>
        </label>
      </div>
      <div id="statsContent" style="margin-top: 20px;"></div>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
